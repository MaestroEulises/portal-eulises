<section id="testimonios" class="scroll-mt-24 py-16 md:py-24">
  <div class="container-page">
    <p class="section-kicker text-center">Voces</p>
    <h2 class="mt-3 text-center font-display text-4xl md:text-5xl">
      {{ site.copy.testimonialsTitle }}
    </h2>
    <div class="ornament" aria-hidden="true">
      <span class="ornament-line"></span>
      <span class="brand-dot brand-dot-lg" aria-hidden="true"></span>
      <span class="ornament-line"></span>
    </div>
    <p class="mx-auto mb-10 max-w-xl text-center text-sm text-cream/55">
      Testimonios de ejemplo, configurables desde el archivo de datos. Pueden reemplazarse por
      reseñas reales.
    </p>
    <div class="grid gap-5 md:grid-cols-2 xl:grid-cols-3">
      @for (item of items; track item.id) {
        <figure class="gold-card rounded-3xl p-6">
          <div
            class="mb-3 flex gap-1 text-gold-light"
            [attr.aria-label]="item.rating + ' de 5 estrellas'"
          >
            @for (star of stars; track star) {
              <svg
                viewBox="0 0 24 24"
                class="h-4 w-4"
                [class.opacity-30]="star > item.rating"
                aria-hidden="true"
              >
                <path
                  fill="currentColor"
                  d="m12 2.5 2.7 5.5 6.1.9-4.4 4.3 1 6.1L12 16.4 6.6 19.3l1-6.1L3.2 8.9l6.1-.9L12 2.5Z"
                />
              </svg>
            }
          </div>
          <blockquote class="text-sm leading-6 text-cream/80">“{{ item.quote }}”</blockquote>
          <figcaption class="mt-4 text-sm text-gold-light">
            {{ item.author }}
            <span class="block text-xs text-cream/50">{{ item.role }}</span>
          </figcaption>
        </figure>
      }
    </div>
  </div>
</section>
