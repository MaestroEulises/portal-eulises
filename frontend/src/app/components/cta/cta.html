<section class="py-8 md:py-16">
  <div
    class="container-page relative overflow-hidden rounded-[2rem] border border-gold/25 px-6 py-14 text-center md:px-16"
    style="
      background:
        radial-gradient(circle at 20% 20%, rgba(109, 40, 217, 0.28), transparent 36%),
        radial-gradient(circle at 80% 10%, rgba(212, 175, 55, 0.16), transparent 32%), #120c22;
    "
  >
    <p class="section-kicker">Conversemos</p>
    <h2 class="mt-3 font-display text-4xl md:text-5xl">{{ site.copy.ctaTitle }}</h2>
    <p class="mx-auto mt-4 max-w-2xl text-cream/75">{{ site.copy.ctaText }}</p>
    <div class="mt-8 flex flex-col items-center justify-center gap-3 sm:flex-row">
      <a class="btn-primary" [href]="whatsappUrl" target="_blank" rel="noopener noreferrer">
        Hablar por WhatsApp
      </a>
      <a routerLink="/" fragment="servicios" class="btn-secondary">Ver servicios</a>
    </div>
  </div>
</section>
