<section id="servicios" class="scroll-mt-24 py-16 md:py-24">
  <div class="container-page">
    <p class="section-kicker">Catálogo</p>
    <h2 class="mt-3 font-display text-4xl md:text-5xl">{{ site.copy.servicesTitle }}</h2>
    <div class="ornament" aria-hidden="true">
      <span class="ornament-line"></span>
      <span class="brand-dot brand-dot-lg" aria-hidden="true"></span>
      <span class="ornament-line"></span>
    </div>
    <p class="mx-auto max-w-2xl text-center text-cream/70">{{ site.copy.servicesText }}</p>
    <div class="mt-10 grid gap-6 sm:grid-cols-2 xl:grid-cols-3">
      @for (service of items; track service.id) {
        <app-service-card [service]="service" />
      }
    </div>
    <div class="mt-10 text-center">
      <a routerLink="/servicios" class="btn-secondary">Ver todos los servicios</a>
    </div>
  </div>
</section>
