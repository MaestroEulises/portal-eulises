<section id="preguntas-frecuentes" class="scroll-mt-24 py-16 md:py-24">
  <div class="container-page max-w-3xl">
    <p class="section-kicker text-center">FAQ</p>
    <h2 class="mt-3 text-center font-display text-4xl md:text-5xl">Preguntas frecuentes</h2>
    <div class="ornament" aria-hidden="true">
      <span class="ornament-line"></span>
      <span class="brand-dot brand-dot-lg" aria-hidden="true"></span>
      <span class="ornament-line"></span>
    </div>
    <div class="mt-8 space-y-3">
      @for (item of items; track item.id) {
        <article class="gold-card overflow-hidden rounded-2xl">
          <h3>
            <button
              type="button"
              class="flex w-full items-center justify-between gap-4 px-5 py-4 text-left"
              [attr.aria-expanded]="openId() === item.id"
              [attr.aria-controls]="'faq-' + item.id"
              (click)="toggle(item.id)"
            >
              <span class="font-display text-xl">{{ item.question }}</span>
              <app-icon
                name="chevron-down"
                [className]="openId() === item.id ? 'rotate-180 transition' : 'transition'"
                [size]="20"
              />
            </button>
          </h3>
          @if (openId() === item.id) {
            <p [id]="'faq-' + item.id" class="px-5 pb-5 text-sm leading-7 text-cream/70">
              {{ item.answer }}
            </p>
          }
        </article>
      }
    </div>
  </div>
</section>
