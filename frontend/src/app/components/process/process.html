<section class="py-16 md:py-24">
  <div class="container-page">
    <p class="section-kicker text-center">Reserva</p>
    <h2 class="mt-3 text-center font-display text-4xl md:text-5xl">{{ site.copy.processTitle }}</h2>
    <div class="ornament" aria-hidden="true">
      <span class="ornament-line"></span>
      <span class="brand-dot brand-dot-lg" aria-hidden="true"></span>
      <span class="ornament-line"></span>
    </div>
    <ol class="relative mt-12 grid gap-8 md:grid-cols-5">
      <li
        class="pointer-events-none absolute top-7 right-8 left-8 hidden h-px bg-gradient-to-r from-transparent via-gold/50 to-transparent md:block"
      ></li>
      @for (step of steps; track step.step) {
        <li class="relative text-center">
          <span
            class="relative z-10 mx-auto flex h-14 w-14 items-center justify-center rounded-full border border-gold/40 bg-ink font-display text-xl text-gold-light shadow-[0_0_24px_rgba(139,92,246,0.25)]"
          >
            {{ step.step }}
          </span>
          <h3 class="mt-4 font-display text-2xl">{{ step.title }}</h3>
          <p class="mt-2 text-sm leading-6 text-cream/65">{{ step.text }}</p>
        </li>
      }
    </ol>
  </div>
</section>
