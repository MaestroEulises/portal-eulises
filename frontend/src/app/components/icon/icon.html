<svg
  xmlns="http://www.w3.org/2000/svg"
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  [attr.stroke-width]="strokeWidth()"
  stroke-linecap="round"
  stroke-linejoin="round"
  [class]="className()"
  aria-hidden="true"
  focusable="false"
>
  @for (node of nodes(); track $index) {
    @switch (node[0]) {
      @case ('path') {
        <path [attr.d]="$any(node[1])['d']" [attr.fill]="$any(node[1])['fill']" />
      }
      @case ('circle') {
        <circle
          [attr.cx]="$any(node[1])['cx']"
          [attr.cy]="$any(node[1])['cy']"
          [attr.r]="$any(node[1])['r']"
        />
      }
      @case ('line') {
        <line
          [attr.x1]="$any(node[1])['x1']"
          [attr.y1]="$any(node[1])['y1']"
          [attr.x2]="$any(node[1])['x2']"
          [attr.y2]="$any(node[1])['y2']"
        />
      }
      @case ('polyline') {
        <polyline [attr.points]="$any(node[1])['points']" />
      }
      @case ('polygon') {
        <polygon [attr.points]="$any(node[1])['points']" />
      }
      @case ('rect') {
        <rect
          [attr.x]="$any(node[1])['x']"
          [attr.y]="$any(node[1])['y']"
          [attr.width]="$any(node[1])['width']"
          [attr.height]="$any(node[1])['height']"
          [attr.rx]="$any(node[1])['rx']"
          [attr.ry]="$any(node[1])['ry']"
        />
      }
      @case ('ellipse') {
        <ellipse
          [attr.cx]="$any(node[1])['cx']"
          [attr.cy]="$any(node[1])['cy']"
          [attr.rx]="$any(node[1])['rx']"
          [attr.ry]="$any(node[1])['ry']"
        />
      }
    }
  }
</svg>
