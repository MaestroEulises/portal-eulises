<section class="relative z-10 -mt-8 pb-8">
  <div class="container-page grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
    @for (item of items; track item.title) {
      <article class="gold-card flex items-center gap-3 rounded-2xl px-4 py-4">
        <span
          class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-violet/20 text-gold-light"
        >
          <app-icon [name]="iconName(item.icon)" [size]="20" />
        </span>
        <h2 class="font-display text-xl leading-snug">{{ item.title }}</h2>
      </article>
    }
  </div>
</section>
