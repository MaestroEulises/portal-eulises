<header
  class="fixed inset-x-0 top-0 z-50 border-b border-transparent transition-all duration-300"
  [class.header-solid]="scrolled() || menuOpen()"
>
  <div class="container-page flex h-16 items-center justify-between gap-4 md:h-[4.5rem]">
    <a
      routerLink="/"
      fragment="inicio"
      class="flex min-w-0 items-center gap-2.5 no-underline md:gap-3"
      (click)="closeMenu()"
    >
      <img
        [src]="site.images.logo"
        [alt]="'Logo de ' + site.name"
        width="48"
        height="48"
        class="h-10 w-10 shrink-0 rounded-full object-cover ring-1 ring-gold/35 shadow-[0_0_18px_rgba(212,175,55,0.25)] md:h-12 md:w-12"
      />
      <span class="min-w-0">
        <p class="font-logo text-base tracking-[0.14em] text-gold-light sm:text-lg md:text-xl">
          {{ site.name }}
        </p>
        <p class="truncate text-[0.65rem] tracking-[0.12em] text-cream/60 sm:text-[0.68rem]">
          Alma mística
        </p>
      </span>
    </a>

    <nav class="hidden items-center gap-6 lg:flex" aria-label="Principal">
      @for (item of navItems; track item.label) {
        <a
          [routerLink]="item.link"
          [fragment]="item.fragment"
          class="text-sm text-cream/75 transition hover:text-gold-light"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="flex items-center gap-2">
      <a
        class="btn-primary hidden !px-4 !py-2.5 text-sm lg:inline-flex"
        [href]="whatsappUrl"
        target="_blank"
        rel="noopener noreferrer"
        (click)="onWhatsAppClick()"
      >
        Consultar por WhatsApp
      </a>
      <button
        type="button"
        class="inline-flex h-11 w-11 items-center justify-center rounded-full border border-gold/25 text-gold-light lg:hidden"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="menu-movil"
        [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
        (click)="toggleMenu()"
      >
        <app-icon [name]="menuOpen() ? 'x' : 'menu'" [size]="22" />
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <div
      id="menu-movil"
      class="border-t border-gold/15 bg-ink/95 px-5 py-6 backdrop-blur-xl lg:hidden"
    >
      <nav class="flex flex-col gap-4" aria-label="Móvil">
        @for (item of navItems; track item.label) {
          <a
            [routerLink]="item.link"
            [fragment]="item.fragment"
            class="py-1 text-lg text-cream/90"
            (click)="closeMenu()"
          >
            {{ item.label }}
          </a>
        }
      </nav>
      <a
        class="btn-primary mt-6 w-full"
        [href]="whatsappUrl"
        target="_blank"
        rel="noopener noreferrer"
        (click)="onWhatsAppClick()"
      >
        Consultar por WhatsApp
      </a>
    </div>
  }
</header>
