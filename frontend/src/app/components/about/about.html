<section id="sobre-nosotros" class="scroll-mt-24 py-16 md:py-24">
  <div class="container-page grid items-center gap-10 lg:grid-cols-2 lg:gap-14">
    <div class="relative mx-auto w-full max-w-md lg:mx-0 lg:max-w-none">
      <div
        class="absolute -inset-3 rounded-[2.2rem] bg-gradient-to-br from-gold/25 via-violet/10 to-transparent blur-sm"
        aria-hidden="true"
      ></div>
      <div
        class="relative overflow-hidden rounded-[2rem] border border-gold/25 shadow-[0_24px_60px_rgba(0,0,0,0.45)]"
      >
        <div class="relative aspect-[3/4] min-h-[360px] bg-night">
          <img
            [src]="site.images.portrait"
            [alt]="'Retrato de referencia de ' + site.name"
            width="720"
            height="960"
            class="absolute inset-0 h-full w-full object-cover object-top"
            loading="lazy"
            decoding="async"
          />
          <div class="absolute inset-0 bg-gradient-to-t from-ink via-ink/20 to-transparent"></div>
        </div>
        <div class="absolute right-4 bottom-4 left-4 flex items-end justify-between gap-3">
          <div>
            <p class="font-logo text-lg tracking-[0.16em] text-gold-light">{{ site.name }}</p>
            <app-brand-tagline class="mt-1" [parts]="site.copy.aboutRoleParts" size="compact" />
          </div>
          <img
            [src]="site.images.logo"
            [alt]="'Emblema de ' + site.name"
            width="52"
            height="52"
            class="h-12 w-12 rounded-full object-cover ring-1 ring-gold/40"
          />
        </div>
      </div>
      <p class="mt-3 text-center text-[0.7rem] text-cream/40 lg:text-left">
        
      </p>
    </div>

    <div>
      <p class="section-kicker">Sobre nosotros</p>
      <h2 class="mt-3 font-display text-4xl md:text-5xl">{{ site.copy.aboutSubtitle }}</h2>
      <p class="mt-2 font-display text-2xl text-gold-light">{{ site.copy.aboutTitle }}</p>
      <div class="ornament justify-start" aria-hidden="true">
        <span class="ornament-line"></span>
        <span class="brand-dot brand-dot-lg" aria-hidden="true"></span>
        <span class="ornament-line"></span>
      </div>
      <p class="text-base leading-7 text-cream/75">{{ site.copy.aboutText }}</p>
      <p class="mt-5 text-sm leading-6 text-cream/60">{{ site.copy.aboutNote }}</p>
      <a
        class="btn-primary mt-8"
        [href]="whatsappUrl"
        target="_blank"
        rel="noopener noreferrer"
        (click)="onWhatsAppClick()"
      >
        Consultar con {{ site.name }}
      </a>
    </div>
  </div>
</section>
